org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Fix for Windows multi-drive Kotlin incremental cache bug (metadata.bin read failure)
kotlin.incremental=false
kotlin.incremental.js=false
# Disable daemon to prevent stale GRADLE_USER_HOME sessions
org.gradle.daemon=false
# Disable parallel builds to avoid cache corruption
org.gradle.parallel=false
# Disable configuration cache to avoid corrupt metadata.bin on H: drive
org.gradle.configuration-cache=false
# Redirect Gradle home to G: drive (avoids H: drive corruption)
org.gradle.user.home=G:\\.gradle

# Use Java 17 for Android Gradle Plugin
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.16.8-hotspot
